# Config publisher per "Pensieri in codice".
# NB: questo è un TEMPLATE. Le variabili ${...} vengono risolte a runtime dal
# workflow (envsubst) prima di passare il file al tool.
# I secret NON stanno qui: arrivano dall'Environment GitHub `pensieriincodice`.

# Cartella prodotta dal generator (relativa al workspace). Risolta a runtime.
input_dir: ${OUTPUT_DIR}

# Stato pubblicazioni: file versionato nel repo, committato ad ogni run.
state_file: ${STATE_FILE}

youtube:
  enabled: true
  client_secrets: ${SECRETS_DIR}/youtube_client_secrets.json
  token: ${SECRETS_DIR}/youtube_token.json
  privacy: public          # private | unlisted | public
  category_id: 28          # 28 = Science & Technology
  default_tags:
    - podcast
    - shorts

instagram:
  enabled: true
  # API Instagram con Instagram Login (graph.instagram.com): serve solo un
  # account IG professional, nessuna Pagina Facebook.
  access_token: ${INSTAGRAM_ACCESS_TOKEN}
  # ig_user_id omesso di proposito: il tool lo risolve dal token. Un secret in meno.
  # Data ISO YYYY-MM-DD: il tool avvisa 7 giorni prima e rifiuta di pubblicare dopo.
  # Il token dura 60 giorni e lo rinnova instagram-token-refresh.yml.
  token_expiry: ${INSTAGRAM_TOKEN_EXPIRY}
  # Questa API non carica file: Meta scarica il video da un URL pubblico. Usiamo
  # l'asset della Release, che lo step "Archivia i video nelle Release" crea
  # PRIMA di pubblicare. Se quell'ordine cambia, Instagram smette di funzionare.
  video_url_template: "https://github.com/valeriogalano/podcast-audiogram-automation/releases/download/pensieriincodice-ep{episode}/{filename}"

tiktok:
  enabled: false

telegram:
  enabled: true
  api_id: ${TELEGRAM_API_ID}
  api_hash: ${TELEGRAM_API_HASH}
  session: ${SECRETS_DIR}/telegram.session
  # Destinazioni distinte per le due strade scelte in base alla durata:
  # <= 60s esce come storia, > 60s come messaggio video.
  story_peers:
    - "me"
    - "@pensieriincodice"
    - "@pensieriincodicecommunity"
  message_peers:
    - "@pensieriincodice"
  period: 86400            # durata story in secondi (86400 = 24h)
  privacy: all             # all | contacts | close_friends
  # Testo del link cliccabile nel messaggio video (soundbite > 60s, che va come
  # post normale invece che come storia). Il messaggio esclude la trascrizione.
  link_text: "Ascolta l'episodio completo →"
