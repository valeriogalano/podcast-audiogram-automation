# Config generator per "Pensieri in codice".
# NB: questo è un TEMPLATE. Le variabili ${...} vengono risolte a runtime dal
# workflow (envsubst) prima di passare il file al tool. Non eseguire il generator
# direttamente su questo file.

feed_url: https://pensieriincodice.it/podcast/index.xml

# Reso relativo al workspace (era un path ProtonDrive/macOS). Risolto a runtime.
output_dir: ${OUTPUT_DIR}

# Su runner effimero renderizziamo l'episodio più recente; il restore dalle
# Release rende il generator idempotente sugli episodi già prodotti.
episode: last
soundbites: all

colors:
  primary: [242, 101, 34]      # Arancione
  background: [235, 213, 197]  # Beige
  text: [255, 255, 255]        # Bianco
  transcript_bg: [0, 0, 0]     # Nero

# Font Linux (DejaVu è preinstallato su ubuntu-latest). Sostituisce il path
# macOS /System/Library/Fonts/Helvetica.ttc.
fonts:
  header: /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
  transcript: /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf

formats:
  vertical:
    width: 1080
    height: 1920
    enabled: true
    description: "Verticale 9:16 (Reels, Stories, Shorts, TikTok)"
  square:
    width: 1080
    height: 1080
    enabled: false
    description: "Quadrato 1:1 (Post Instagram, Twitter, Mastodon)"
  horizontal:
    width: 1920
    height: 1080
    enabled: false
    description: "Orizzontale 16:9 (YouTube)"

hashtags:
  - podcast
  - pensieriincodice

# Posizione del blocco sottotitoli: frazione dell'area centrale misurata dal suo
# bordo alto. Il default del generator e' 0.84; 0.91 lo abbassa di circa un rigo
# (un rigo vale ~0.07 in verticale), per portarlo dentro la fascia arancione in
# basso senza accavallarsi al CTA "Link in bio" che sta a 0.23.
subtitles:
  vertical:
    y_offset: 0.91

show_subtitles: true
use_episode_cover: true
header_title_source: soundbite

caption_labels:
  episode_prefix: "Episodio"
  listen_full_prefix: "Ascolta l'episodio completo"

# Posizione della trascrizione nel file .txt del caption:
#   inline -> tra il titolo del soundbite e il link (default del generator)
#   last   -> ultimo blocco, dopo gli hashtag
#   none   -> omessa dal .txt (resta comunque nel .srt)
# Richiede il supporto del generator (PR podcast-audiogram-generator#2).
caption_transcript: last

cta:
  enabled: true
  text: "Link in bio"
  vertical:
    # Fra il titolo del soundbite e la copertina. Verificato in locale l'11/08/2026
    # su ep150/sb1: a 0.82 finiva nella fascia bassa, dove l'interfaccia di
    # Instagram (didascalia, audio, pulsanti) lo copriva.
    # La fascia arancione in basso resta libera: e' li' che andranno i sottotitoli.
    y_offset: 0.23
  square:
    y_offset: 0.85
  horizontal:
    y_offset: 0.85

# Soundbites definiti manualmente (opzionale). Vuoto: il feed contiene i tag
# <podcast:soundbite>.
manual_soundbites:
